name: Validate agentic engineering assets

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"
      - "docs/agentic-engineering.md"
  push:
    branches:
      - develop
      - main
    paths:
      - "AGENTS.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"
      - "docs/agentic-engineering.md"

permissions:
  contents: read

concurrency:
  group: validate-agentic-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ".github/scripts/requirements.txt"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt
      - name: Validate agents, skills, and scoped instructions
        run: python .github/scripts/validate-agentic-assets.py
