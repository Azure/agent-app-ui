name: Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Select protected unittest evidence runner
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          for file in .github/scripts/check-quality.py .github/scripts/run-unittest.py requirements-quality.txt; do
            if git cat-file -e "$BASE_SHA:.quality/policy.json" 2>/dev/null; then
              git show "$BASE_SHA:$file" > "$RUNNER_TEMP/$(basename "$file")"
            else
              cp "$file" "$RUNNER_TEMP/$(basename "$file")"
            fi
          done
      - name: Install runtime dependencies and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r "$RUNNER_TEMP/requirements-quality.txt"
          python -m pip install --no-deps -e .
      - name: Run existing unittest suite including installed wheel acceptance
        run: python "$RUNNER_TEMP/run-unittest.py" --base-ref "$BASE_SHA" --report .artifacts/unittest.json
      - name: Retain exact unittest execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-unittest
          path: .artifacts/unittest.json
          if-no-files-found: error
          retention-days: 7

  quality:
    name: ${{ matrix.check }}
    if: always()
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typing, architecture, exceptions, policy]
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Select protected-base evaluator and tool pins
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:.github/scripts/check-quality.py" 2>/dev/null; then
            git show "$BASE_SHA:.github/scripts/check-quality.py" > "$RUNNER_TEMP/check-quality.py"
            git show "$BASE_SHA:requirements-quality.txt" > "$RUNNER_TEMP/requirements-quality.txt"
          else
            # Bootstrap is explicitly a policy violation, not self-approved enforcement.
            cp .github/scripts/check-quality.py "$RUNNER_TEMP/check-quality.py"
            cp requirements-quality.txt "$RUNNER_TEMP/requirements-quality.txt"
          fi
          git show "$BASE_SHA:requirements.txt" > "$RUNNER_TEMP/runtime-requirements.txt"
          # No candidate package/build backend/.pth is installed into the evaluator.
          python -I -m venv "$RUNNER_TEMP/quality-tools"
          "$RUNNER_TEMP/quality-tools/bin/python" -I -m pip install -r "$RUNNER_TEMP/requirements-quality.txt" -r "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Read same-run unittest evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-unittest
          path: .artifacts
      - name: Evaluate candidate against protected minimum
        run: '"$RUNNER_TEMP/quality-tools/bin/python" -I "$RUNNER_TEMP/check-quality.py" --check "${{ matrix.check }}" --base-ref "$BASE_SHA" --test-evidence .artifacts/unittest.json --report ".artifacts/${{ matrix.check }}.json"'
      - name: Retain bound report even when checks fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ matrix.check }}
          path: .artifacts/${{ matrix.check }}.json
          if-no-files-found: error
          retention-days: 7

  container-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build ephemeral Linux image without publishing
        run: docker build --tag "gpt-rag-ui-quality:$GITHUB_SHA" .
      - name: Check installed origins, startup, resources and behavioral contracts offline
        run: >-
          docker run --rm --network none --env PYTHONDONTWRITEBYTECODE=1
          --mount "type=bind,source=$GITHUB_WORKSPACE/tests,target=/tests,readonly"
          "gpt-rag-ui-quality:$GITHUB_SHA" python /tests/container_smoke.py

  quality-gate:
    name: quality-gate
    if: always()
    needs: [quality, unit-tests, container-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      TEST_RESULT: ${{ needs.unit-tests.result }}
      CONTAINER_RESULT: ${{ needs.container-tests.result }}
    steps:
      - name: Check out evaluation inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download every quality report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quality-*
          path: .artifacts/reports
          merge-multiple: true
      - name: Reject failed, skipped, missing or stale execution
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/scripts/check-quality.py .github/scripts/aggregate-quality.py; do
            if git cat-file -e "$BASE_SHA:.quality/policy.json" 2>/dev/null; then
              git show "$BASE_SHA:$file" > "$RUNNER_TEMP/$(basename "$file")"
            else
              cp "$file" "$RUNNER_TEMP/$(basename "$file")"
            fi
          done
          python "$RUNNER_TEMP/aggregate-quality.py" --base-ref "$BASE_SHA" --reports-dir .artifacts/reports
